name: ESPN Hizli
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  espn:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas numpy
      - name: ESPN
        run: python .github/workflows/scripts/fetch_espn_gaps.py
      - name: Commit ve push
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add gaps_output/
          git diff --staged --quiet || git commit -m "ESPN guncelleme"
          git pull --rebase
          git push
